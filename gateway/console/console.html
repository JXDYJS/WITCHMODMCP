<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Witch Lua Console</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { background: #1e1e1e; color: #d4d4d4; font-family: "Segoe UI", system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100vh; }
      .toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: #252526; border-bottom: 1px solid #3c3c3c; }
      .toolbar strong { font-size: 13px; color: #e0e0e0; }
      #run { background: #0e639c; color: #fff; border: none; border-radius: 3px; padding: 4px 14px; font-size: 12px; cursor: pointer; }
      #run:hover { background: #1177bb; }
      #run:disabled { background: #3a3d41; color: #808080; cursor: not-allowed; }
      #status { font-size: 12px; margin-left: auto; }
      #status.ok { color: #4ec9b0; }
      #status.warn { color: #dcdcaa; }
      #status.err { color: #f14c4c; }
      #editor-wrap { flex: 0 0 40%; min-height: 140px; border-bottom: 1px solid #3c3c3c; overflow: hidden; }
      #editor, #editor .cm-editor { height: 100%; }
      #output { flex: 1 1 auto; overflow-y: auto; padding: 8px 12px; font-family: Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
      #output div { min-height: 1em; }
      .c-gray { color: #808080; } .c-red { color: #f14c4c; } .c-green { color: #6a9955; }
      .c-yellow { color: #dcdcaa; } .c-blue { color: #569cd6; } .c-magenta { color: #c586c0; }
      .c-cyan { color: #4ec9b0; } .c-white { color: #e0e0e0; }
      .footer { flex: 0 0 auto; padding: 3px 12px; font-size: 11px; color: #6a6a6a; background: #252526; border-top: 1px solid #3c3c3c; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <strong>Witch Lua Console</strong>
        <button id="run" title="执行当前代码（Ctrl+Enter）">▶ 运行</button>
        <span id="status" class="warn">连接中…</span>
      </div>
      <div id="editor-wrap"><div id="editor"></div></div>
      <div id="output"></div>
      <div class="footer">Lua REPL · 由 MCP 网关托管 · Ctrl+Enter 执行 / Shift+Enter 换行 · WebSocket ws://<span id="ws-host"></span></div>
    </div>
    <!-- @@WS_PORT@@ is injected by the gateway (mod port + 1) -->
    <script>window.__WS_PORT__ = @@WS_PORT@@;</script>
    <script type="module" src="./dist/console.js"></script>
  </body>
</html>
